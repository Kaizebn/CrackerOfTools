[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.0.0"
description = "JARVIS — assistant IA vocal pour Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "structlog==24.4.0",
    "colorama==0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "mypy==1.11.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

# Les libs tierces ci-dessous n'exposent pas de stubs ; on coupe l'erreur
# d'import manquant sur elles, sans relâcher la rigueur sur notre propre code.
# Elles seront réellement importées à partir des phases suivantes.
[[tool.mypy.overrides]]
module = [
    "sounddevice.*",
    "pyautogui.*",
    "pycaw.*",
    "screen_brightness_control.*",
    "piper.*",
    "openwakeword.*",
    "chromadb.*",
    "sentence_transformers.*",
    "trafilatura.*",
    "ddgs.*",
]
ignore_missing_imports = true
