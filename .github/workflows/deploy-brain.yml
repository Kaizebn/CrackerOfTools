name: Deploy BRAIN to GitHub Pages

# Builds the BRAIN app (in brain/) and publishes it to GitHub Pages.
# One-time setup by the repo owner: Settings → Pages → Source = "GitHub Actions".
# After that, every push that changes brain/ redeploys the site automatically.
on:
  push:
    branches:
      - main
      - claude/brain-content-creator-app-tsl7pq
    paths:
      - 'brain/**'
      - '.github/workflows/deploy-brain.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: brain/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: brain/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
